version: "3.8"

services:
  liteapp-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liteapp-studio
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin888}
      - DATA_DIR=/app/data
      - DEFAULT_OPENAI_BASE_URL=${DEFAULT_OPENAI_BASE_URL:-https://api.openai.com/v1}
      - DEFAULT_OPENAI_API_KEY=${DEFAULT_OPENAI_API_KEY:-}
      - DEFAULT_OPENAI_MODEL=${DEFAULT_OPENAI_MODEL:-gpt-4o}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
